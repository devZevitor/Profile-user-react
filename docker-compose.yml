services:
  app:
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm install && npx expo start --host lan"
    ports:
      - "8081:8081"
    environment:
      REACT_NATIVE_PACKAGER_HOSTNAME: ${HOST_IP:?Defina HOST_IP com o IPv4 do seu computador}
      EXPO_NO_TELEMETRY: "1"
      NPM_CONFIG_FETCH_TIMEOUT: "600000"
      NPM_CONFIG_FETCH_RETRIES: "5"
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
    volumes:
      - .:/app
      - /app/node_modules
    stdin_open: true
    tty: true
